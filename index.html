<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Photobooth</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:#14161b;color:#eee}
main{max-width:1200px;margin:auto;padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:24px}
@media(max-width:800px){main{grid-template-columns:1fr}}
main.wide{grid-template-columns:1fr}
h1{font-size:18px;margin:0;grid-column:1/-1}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
button,select{background:#252a33;color:#eee;border:1px solid #3a414d;border-radius:8px;padding:9px 12px;font:inherit;cursor:pointer}
button.on{background:#e8e1cf;color:#14161b;border-color:#e8e1cf}
button.go{background:#4f7cff;border-color:#4f7cff;color:#fff}
#wrap{position:relative;width:100%;max-width:calc(62vh*var(--r,1.33));aspect-ratio:var(--r,1.33);background:#000;border-radius:10px;overflow:hidden}
video{width:100%;height:100%;object-fit:cover;display:block}
#cd{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:140px;font-weight:700;color:#fff;text-shadow:0 2px 20px #000}
#out{width:100%;height:auto;border-radius:6px;background:#fff;cursor:pointer;display:block}
#gr{position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;opacity:.5;display:none;background-size:256px}
input{background:#252a33;color:#eee;border:1px solid #3a414d;border-radius:8px;padding:9px 12px;font:inherit;width:100%}
small{color:#9aa3b2;display:block}
</style></head><body>
<main>
<h1>Photobooth</h1>
<section>
 <input id="nm" placeholder="Name (boarding pass / card)" maxlength="14">
 <div class="row" id="lay"></div>
 <div id="wrap"><video id="v" playsinline muted autoplay></video><div id="gr"></div><div id="cd"></div></div>
 <div class="row" id="flt"></div>
 <div class="row" id="col"></div>
 <div class="row"><button class="go" id="go">Start</button><button id="sw">Flip camera</button><button id="rs">Reset</button></div>
 <small id="cm"></small><small id="fm"></small>
</section>
<section>
 <canvas id="out"></canvas>
 <small id="sz" style="margin-top:8px"></small>
 <div class="row"><button id="dl">Download PNG (full size)</button><select id="cp"><option value="1">1 copy</option><option value="2">2 copies</option></select><button id="pr">Print PDF (A4)</button></div>
 <small>Tap a photo in the preview to retake it.</small>
</section>
</main>
<script>
const $=id=>document.getElementById(id),sleep=ms=>new Promise(r=>setTimeout(r,ms)),v=$('v'),c=$('out'),wrap=$('wrap');
const NAVY='#111111',CREAM='#EFEFEF',mm=n=>(n/300*25.4).toFixed(1);
const FILTERS={Normal:'none',Mono:'grayscale(1) contrast(1.2) brightness(1.05)',Sepia:'sepia(.8)',Vintage:'sepia(.4) contrast(1.1) saturate(1.3) brightness(.95)',Warm:'sepia(.25) saturate(1.4) hue-rotate(-10deg)',Cool:'saturate(1.1) hue-rotate(15deg) brightness(1.05)',Fade:'contrast(.85) brightness(1.1) saturate(.8)',Vivid:'saturate(1.6) contrast(1.1)'};
const KX=750/630,KY=1050/880;
const g=(cl,r,sw,sh)=>{const o=[];for(let j=0;j<r;j++)for(let i=0;i<cl;i++)o.push({x:30+i*(sw+30),y:30+j*(sh+30),w:sw,h:sh});return o};
const LAY={
 bp:{name:'Boarding Pass',w:1800,h:600,info:'6x2 in, 3 photos',bg:CREAM,grain:true,slots:[633,1012,1391].map(x=>({x,y:114,w:355,h:404})),over:bpOver},
 pk:{name:'Trading Card · 1 photo',w:750,h:1050,bg:'#fff',slots:[{x:46*KX,y:108*KY,w:538*KX,h:388*KY}],under:pkUnder,over:pkOver},
 l1:{name:'1 · 2x6 · 3 photos',w:600,h:1800,file:'frame-1.png',def:g(1,3,540,520)},
 l2:{name:'2 · 2x6 · 4 photos',w:600,h:1800,file:'frame-2.png',def:g(1,4,540,380)},
 l3:{name:'3 · 4x6 · 6 photos',w:1200,h:1800,file:'frame-3.png',def:g(2,3,555,520)}};
let key,L,slots=[],frameImg=null,photos=[],D=new Date(),facing='user',filt='Mono',busy=false,NAME='',PBG='#ffffff',TH='Water';
const FR={},p2=n=>String(n).padStart(2,'0'),dateStr=()=>`${p2(D.getDate())} / ${p2(D.getMonth()+1)} / ${D.getFullYear()}`;
const loadImg=u=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=u});

const NZ=(()=>{const t=document.createElement('canvas');t.width=t.height=256;const x=t.getContext('2d'),d=x.createImageData(256,256);for(let i=0;i<d.data.length;i+=4){d.data[i]=d.data[i+1]=d.data[i+2]=Math.random()*255;d.data[i+3]=255}x.putImageData(d,0,0);return t})();
/* text with letter spacing */
function W(x,s,wt,fam,sz,ls){x.font=`${wt} ${sz}px ${fam}`;return[...s].reduce((a,ch)=>a+x.measureText(ch).width+ls*sz,0)-ls*sz}
function T(x,s,px,py,wt,fam,sz,col,ls,al){const w=W(x,s,wt,fam,sz,ls);x.fillStyle=col;x.textAlign='left';x.textBaseline='alphabetic';let cx=al=='r'?px-w:al=='c'?px-w/2:px;for(const ch of s){x.fillText(ch,cx,py);cx+=x.measureText(ch).width+ls*sz}return w}

/* boarding pass frame, drawn at 1800x600 */
function bpOver(x){
 const C="'Barlow Condensed',sans-serif",B="Barlow,sans-serif",G='#555555';
 x.fillStyle=NAVY;x.fillRect(0,0,1800,84);
 T(x,'BOARDING PASS',54,56,600,C,36,CREAM,.22);
 T(x,'G.GFX',1746,54,600,C,27,CREAM,.22,'r');
 const lb=(s,px,py)=>T(x,s.toUpperCase(),px,py,400,B,16.5,G,.14);
 const vl=(s,px,py)=>T(x,s,px,py,700,C,33,NAVY,.04);
 const wM=W(x,'MNL',700,C,102,0),wS=W(x,'NYC',700,C,102,0),bx=579-wS;
 lb('From',54,130);T(x,'MNL',54,222,700,C,102,NAVY,0);lb('Manila',54,250);
 lb('To',bx,130);T(x,'NYC',bx,222,700,C,102,NAVY,0);lb('New York',bx,250);
 const ac=(54+wM+bx)/2;x.strokeStyle=NAVY;x.lineWidth=3;x.beginPath();x.moveTo(ac-33,236);x.lineTo(ac+27,236);x.moveTo(ac+15,224);x.lineTo(ac+27,236);x.lineTo(ac+15,248);x.stroke();
 const row=(y,it)=>{const ws=it.map(([l,val])=>Math.max(W(x,l.toUpperCase(),400,B,16.5,.14),W(x,val,700,C,33,.04))),gap=Math.max(12,(525-ws.reduce((a,b)=>a+b))/(it.length-1));let cx=54;it.forEach(([l,val],i)=>{lb(l,cx,y);vl(val,cx,y+36);cx+=ws[i]+gap})};
 row(318,[['Passenger',(NAME||'YOUR NAME').toUpperCase()],['Class','FOREVER'],['Date',dateStr()]]);
 row(400,[['Flight','GF 0125'],['Gate','03'],['Seat','12F']]);
 x.fillStyle=NAVY;for(let i=54;i+19.5<=579;i+=22.5){x.fillRect(i,480,3,51);x.fillRect(i+7.5,480,1.5,51);x.fillRect(i+15,480,4.5,51)}
 lb('Live with no regrets',54,559);
 ['DEPARTURE','IN FLIGHT','ARRIVAL'].forEach((s,i)=>T(x,s,LAY.bp.slots[i].x+177.5,551,600,C,22.5,NAVY,.2,'c'));
}

const PL=['white','black','ivory','lightgray','lightpink','lightskyblue','lightgreen','khaki'];
const THEMES={Water:['deepskyblue','lightskyblue','lightblue'],Fire:['orangered','orange','navajowhite'],Grass:['limegreen','lightgreen','honeydew'],Electric:['gold','khaki','lightyellow'],Psychic:['mediumorchid','plum','thistle'],Dark:['dimgray','gray','darkgray'],Fairy:['hotpink','pink','mistyrose']};
function buildColors(){
 const d=$('col');d.innerHTML='';
 if(key=='pk')Object.keys(THEMES).forEach(n=>{const b=document.createElement('button');b.textContent=n;b.className=n==TH?'on':'';b.style.borderLeft='12px solid '+THEMES[n][0];b.onclick=()=>{TH=n;buildColors();render()};d.append(b)});
 else if(L.file&&!frameImg){
  PL.forEach(n=>{const b=document.createElement('button');b.title=n;b.style.cssText='width:34px;height:34px;padding:0;background:'+n;b.onclick=()=>{PBG=n;render()};d.append(b)});
  const i=document.createElement('input');i.type='color';i.value='#ffffff';i.style.cssText='width:44px;height:34px;padding:2px';i.oninput=e=>{PBG=e.target.value;render()};d.append(i);
 }
}
/* trading card, drawn in 630x880 design units */
function pkUnder(x){
 x.save();x.scale(KX,KY);
 let gr=x.createLinearGradient(4.2,-3.5,625.8,883.5);gr.addColorStop(0,'#e6e8ea');gr.addColorStop(.45,'#a9aeb4');gr.addColorStop(1,'#d9dcdf');
 x.fillStyle=gr;x.beginPath();x.roundRect(0,0,630,880,30);x.fill();
 const t=THEMES[TH];gr=x.createLinearGradient(0,14,0,866);gr.addColorStop(0,t[0]);gr.addColorStop(.45,t[1]);gr.addColorStop(1,t[2]);
 x.fillStyle=gr;x.beginPath();x.roundRect(14,14,602,852,18);x.fill();x.restore();
}
function pkOver(x){
 const C="'Barlow Condensed',sans-serif",B="Barlow,sans-serif",ink='#0b1b2e';
 x.save();x.scale(KX,KY);
 const gem=(cx,cy,c1,c2,bd,drop)=>{const r=x.createRadialGradient(cx-5,cy-7,0,cx-5,cy-7,28);r.addColorStop(0,c1);r.addColorStop(1,c2);x.fillStyle=r;x.strokeStyle=bd;x.lineWidth=2;x.beginPath();x.arc(cx,cy,16,0,7);x.fill();x.stroke();if(drop){x.save();x.translate(cx-9,cy-9);x.scale(.75,.75);x.fillStyle='#e8f3ff';x.fill(new Path2D('M12 2C9 7 5 10.5 5 15a7 7 0 0014 0c0-4.5-4-8-7-13z'));x.restore()}};
 const bw=W(x,'BASIC','italic 700',C,15,.06)+28,bg=x.createLinearGradient(0,52,0,78);bg.addColorStop(0,'#f2f2f2');bg.addColorStop(1,'#bfc4c9');
 x.fillStyle=bg;x.beginPath();x.roundRect(40,52,bw,26,[4,14,4,4]);x.fill();
 T(x,'BASIC',52,71,'italic 700',C,15,'#10253d',.06);
 T(x,NAME||'Your Name',40+bw+14,80,700,C,44,ink,0);
 const w1=T(x,'120',542,80,700,C,44,ink,0,'r');T(x,'HP',542-w1-14,78,700,C,16,ink,0,'r');
 gem(573,65,'#5aa0e8','#16427f','#0d2748',true);
 x.fillStyle='#c9ced3';x.fillRect(40,102,550,6);x.fillRect(40,102,6,400);x.fillRect(584,102,6,400);x.fillStyle='#9ba1a8';x.fillRect(40,496,550,6);
 const cb=x.createLinearGradient(0,506,0,528);cb.addColorStop(0,'#f4f4f4');cb.addColorStop(1,'#aab0b6');x.fillStyle=cb;x.beginPath();x.roundRect(40,506,550,22,3);x.fill();
 T(x,"NO. 01   Human   HT: 5' 8\"   WT: 60 kg",315,522,600,B,13,'#10253d',0,'c');
 gem(57,583,'#5aa0e8','#16427f','#0d2748',true);gem(105,583,'#ffffff','#b5bcc4','#7b838c',false);
 const w2=T(x,'30+',590,594,700,C,32,ink,0,'r');T(x,'Memory Lane',(136+590-w2-14)/2,594,700,C,32,ink,0,'c');
 let ln='',y=626;x.font=`400 18px ${B}`;
 for(const w of 'Flip a coin. If heads, this attack does 30 more damage. (Every smile makes the moment hit a little harder.)'.split(' ')){const t=ln?ln+' '+w:w;if(W(x,t,400,B,18,0)>550&&ln){T(x,ln,40,y,400,B,18,ink,0);y+=24.3;ln=w}else ln=t}
 T(x,ln,40,y,400,B,18,ink,0);
 x.fillStyle='#b4bac0';x.fillRect(40,795,550,3);
 const it=['weakness  x2','resistance','retreat'],ws=it.map(t=>W(x,t,600,B,13,0)),gp=(550-ws[0]-ws[1]-ws[2])/2;let cx=40;
 it.forEach((t,i)=>{T(x,t,cx,820,600,B,13,'#10253d',0);cx+=ws[i]+gp});
 T(x,'\u00a9 G.GFX',40,848,700,C,15,ink,.12);T(x,'GRAYSON.GFX',590,848,700,C,15,ink,.12,'r');
 x.restore();
}
/* auto-detect fully transparent holes in a frame PNG */
function holes(img,Wd,H){
 const t=document.createElement('canvas');t.width=Wd;t.height=H;const x=t.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0,Wd,H);
 const a=x.getImageData(0,0,Wd,H).data,seen=new Uint8Array(Wd*H),out=[];
 for(let i=0;i<Wd*H;i++){
  if(seen[i]||a[i*4+3]>20)continue;
  let x0=Wd,y0=H,x1=0,y1=0,n=0;const st=[i];seen[i]=1;
  while(st.length){
   const p=st.pop(),px=p%Wd,py=(p/Wd)|0;n++;
   if(px<x0)x0=px;if(px>x1)x1=px;if(py<y0)y0=py;if(py>y1)y1=py;
   for(const q of[px>0&&p-1,px<Wd-1&&p+1,py>0&&p-Wd,py<H-1&&p+Wd])if(q!==false&&!seen[q]&&a[q*4+3]<=20){seen[q]=1;st.push(q)}
  }
  if(n>4000&&x0>0&&y0>0&&x1<Wd-1&&y1<H-1)out.push({x:x0,y:y0,w:x1-x0+1,h:y1-y0+1});
 }
 return out.sort((a,b)=>Math.abs(a.y-b.y)>40?a.y-b.y:a.x-b.x);
}

function cover(x,im,s){const r=s.w/s.h;let sw=im.width,sh=sw/r;if(sh>im.height){sh=im.height;sw=sh*r}x.drawImage(im,(im.width-sw)/2,(im.height-sh)/2,sw,sh,s.x,s.y,s.w,s.h)}
function ph(x,s,i){const gr=x.createLinearGradient(0,s.y,0,s.y+s.h);gr.addColorStop(0,'#c9c9c9');gr.addColorStop(1,'#6f6f6f');x.fillStyle=L.file?'#DCDCDC':gr;x.fillRect(s.x,s.y,s.w,s.h);x.fillStyle='#1a1a1a';x.font=`600 ${Math.round(s.w/16)}px Barlow,sans-serif`;x.textAlign='center';x.textBaseline='middle';x.fillText('PHOTO '+(i+1),s.x+s.w/2,s.y+s.h/2)}
function render(){
 c.width=L.w;c.height=L.h;const x=c.getContext('2d');
 x.fillStyle=L.bg||(frameImg?'#fff':PBG);x.fillRect(0,0,L.w,L.h);if(L.under)L.under(x);
 slots.forEach((s,i)=>photos[i]?cover(x,photos[i],s):ph(x,s,i));
 if(L.over)L.over(x);
 else if(frameImg)x.drawImage(frameImg,0,0,L.w,L.h);
 ;
 if(L.grain){const pt=x.createPattern(NZ,'repeat');pt.setTransform(new DOMMatrix().scale(2));x.save();x.globalCompositeOperation='overlay';x.globalAlpha=.55;x.fillStyle=pt;x.fillRect(0,0,L.w,L.h);x.restore()}
}
async function setLayout(k){
 key=k;L=LAY[k];photos=[];frameImg=null;slots=L.slots||L.def;$('fm').textContent='';
 if(L.file){
  if(!(L.file in FR))FR[L.file]=await loadImg(L.file);
  const im=FR[L.file];let h=[];
  if(im){try{h=holes(im,L.w,L.h)}catch(e){$('fm').textContent='Could not read '+L.file+'. Host the app on https or localhost.'}}
  if(h.length){frameImg=im;slots=h}else if(!$('fm').textContent)$('fm').textContent=L.file+' not found, using a plain placeholder frame.';
 }
 document.querySelectorAll('#lay button').forEach(b=>b.classList.toggle('on',b.dataset.k==k));
 $('cp').disabled=L.w>1000;if(L.w>1000)$('cp').value=1;
 $('sz').textContent=`Print size on A4: ${mm(L.w)} x ${mm(L.h)} mm · full file ${L.w} x ${L.h} px`;
 $('gr').style.display=L.grain?'block':'none';document.querySelector('main').classList.toggle('wide',L.w>L.h);wrap.style.setProperty('--r',slots[0].w/slots[0].h);buildColors();render();
}
async function cam(){
 try{
  if(v.srcObject)v.srcObject.getTracks().forEach(t=>t.stop());
  v.srcObject=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1920},height:{ideal:1080}},audio:false});
  v.style.transform=facing=='user'?'scaleX(-1)':'none';$('cm').textContent='';
 }catch(e){$('cm').textContent='Camera blocked or not found. Allow camera access (needs https or localhost).'}
}
function snap(){
 const t=document.createElement('canvas');t.width=v.videoWidth;t.height=v.videoHeight;const x=t.getContext('2d');
 if(facing=='user'){x.translate(t.width,0);x.scale(-1,1)}
 x.filter=FILTERS[filt];x.drawImage(v,0,0);return t;
}
async function run(ids){
 if(busy||!v.videoWidth)return;busy=true;
 for(const i of ids){
  wrap.style.setProperty('--r',slots[i].w/slots[i].h);
  for(let n=3;n>0;n--){$('cd').textContent=n;await sleep(1000)}
  $('cd').textContent='';photos[i]=snap();D=new Date();render();await sleep(500);
 }
 busy=false;
}
/* UI */
Object.entries(LAY).forEach(([k,l])=>{const b=document.createElement('button');b.dataset.k=k;b.textContent=l.name;b.onclick=()=>setLayout(k);$('lay').append(b)});
Object.keys(FILTERS).forEach(f=>{const b=document.createElement('button');b.textContent=f;b.className=f==filt?'on':'';b.onclick=()=>{filt=f;v.style.filter=FILTERS[f];document.querySelectorAll('#flt button').forEach(o=>o.classList.toggle('on',o==b))};$('flt').append(b)});
if(!('filter' in CanvasRenderingContext2D.prototype))$('cm').textContent='This browser cannot bake filters into saved photos. Use Chrome or Edge.';
$('nm').oninput=e=>{NAME=e.target.value.trim();render()};
$('gr').style.backgroundImage='url('+NZ.toDataURL()+')';v.style.filter=FILTERS[filt];
$('go').onclick=()=>{if(busy)return;photos=[];render();run(slots.map((_,i)=>i))};
$('rs').onclick=()=>{if(!busy){photos=[];render()}};
$('sw').onclick=()=>{facing=facing=='user'?'environment':'user';cam()};
c.onclick=e=>{const r=c.getBoundingClientRect(),px=(e.clientX-r.left)*L.w/r.width,py=(e.clientY-r.top)*L.h/r.height,i=slots.findIndex(s=>px>=s.x&&px<=s.x+s.w&&py>=s.y&&py<=s.y+s.h);if(i>=0)run([i])};
$('dl').onclick=()=>c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`photostrip-${key}-${D.toISOString().slice(0,10)}.png`;a.click()});
$('pr').onclick=()=>{
 const doc=new window.jspdf.jsPDF({unit:'mm',format:'a4'}),wm=L.w/300*25.4,hm=L.h/300*25.4,n=+$('cp').value,img=c.toDataURL('image/png'),gap=10,tall=L.h>L.w;
 const tw=tall?n*wm+(n-1)*gap:wm,th=tall?hm:n*hm+(n-1)*gap,x0=(210-tw)/2,y0=(297-th)/2;
 doc.setDrawColor(140);doc.setLineWidth(.2);
 for(let i=0;i<n;i++){
  const x=tall?x0+i*(wm+gap):x0,y=tall?y0:y0+i*(hm+gap);
  doc.addImage(img,'PNG',x,y,wm,hm);
  for(const[cx,cy,dx,dy]of[[x,y,-1,-1],[x+wm,y,1,-1],[x,y+hm,-1,1],[x+wm,y+hm,1,1]]){doc.line(cx+dx*2,cy,cx+dx*5,cy);doc.line(cx,cy+dy*2,cx,cy+dy*5)}
 }
 doc.setFontSize(8);doc.setTextColor(120);doc.text(`Strip size on A4: ${wm.toFixed(1)} x ${hm.toFixed(1)} mm · ${n} cop${n>1?'ies':'y'} · print at 100% / actual size`,105,288,{align:'center'});
 doc.save(`photostrip-${key}-A4.pdf`);
};
(async()=>{
 try{await Promise.all(['700 30px "Barlow Condensed"','600 30px "Barlow Condensed"','400 16px Barlow','600 16px Barlow'].map(f=>document.fonts.load(f)))}catch(e){}
 await setLayout('bp');cam();
})();
</script></body></html>
